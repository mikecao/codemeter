name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (e.g. v0.1.0)"
        required: true

permissions:
  contents: write

jobs:
  build:
    env:
      RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            args: ""
          - platform: macos-latest
            args: "--target aarch64-apple-darwin"
          - platform: macos-latest
            args: "--target x86_64-apple-darwin"
          - platform: ubuntu-22.04
            args: ""

    runs-on: ${{ matrix.platform }}

    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v5
        with:
          version: latest

      - uses: actions/setup-node@v6
        with:
          node-version: lts/*
          cache: pnpm

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - run: pnpm install

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ env.RELEASE_TAG }}
          releaseName: "codemeter ${{ env.RELEASE_TAG }}"
          releaseBody: "Building release artifactsâ€¦"
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}

  notes:
    needs: build
    runs-on: ubuntu-latest
    env:
      RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Generate and publish release notes
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Keep hand-written notes: only generate when the body is still the build placeholder.
          CURRENT_BODY=$(gh release view "${RELEASE_TAG}" --json body -q .body 2>/dev/null || echo "")
          if [ -n "$CURRENT_BODY" ] && [ "$CURRENT_BODY" != "Building release artifacts…" ]; then
            echo "Release already has custom notes; skipping generation."
            exit 0
          fi
          PREV_TAG=$(git describe --tags --abbrev=0 "${RELEASE_TAG}^" 2>/dev/null || echo "")
          if [ -n "$PREV_TAG" ]; then
            RANGE="${PREV_TAG}..${RELEASE_TAG}"
          else
            RANGE="${RELEASE_TAG}"
          fi
          {
            echo "## What's changed"
            echo
            git log --no-merges --reverse \
              --pretty=format:'- %s' "$RANGE" \
              | grep -viE '^- (Bump version|Trigger release|Merge )' || true
            echo
            if [ -n "$PREV_TAG" ]; then
              echo
              echo "**Full changelog**: https://github.com/${{ github.repository }}/compare/${PREV_TAG}...${RELEASE_TAG}"
            fi
          } > notes.md
          cat notes.md
          gh release edit "${RELEASE_TAG}" --notes-file notes.md
